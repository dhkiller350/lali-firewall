# Unbound DNS Configuration for Raspberry Pi 3B+
# Place this file at: /etc/unbound/unbound.conf.d/custom.conf

server:
    # Network interface and port settings
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Access control - allow local network queries
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: ::1 allow
    access-control: fc00::/7 allow
    access-control: fe80::/10 allow

    # Performance settings for Raspberry Pi 3B+
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2

    # Cache sizes (optimized for 1GB RAM on RPi 3B+)
    rrset-cache-size: 64m
    msg-cache-size: 32m
    key-cache-size: 16m
    neg-cache-size: 4m

    # Buffer sizes
    so-rcvbuf: 1m
    so-sndbuf: 1m

    # Prefetch settings for better performance
    prefetch: yes
    prefetch-key: yes

    # Security settings
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    
    # Privacy settings
    minimal-responses: yes
    qname-minimisation: yes
    rrset-roundrobin: yes

    # DNSSEC validation
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    trust-anchor-signaling: yes
    root-key-sentinel: yes
    val-clean-additional: yes

    # Logging (adjust verbosity as needed)
    verbosity: 1
    logfile: "/var/log/unbound/unbound.log"
    log-queries: no
    log-replies: no
    log-servfail: yes

    # TTL settings
    cache-min-ttl: 300
    cache-max-ttl: 86400

    # Reduce latency
    serve-expired: yes
    serve-expired-ttl: 3600

    # PS5 and gaming optimization - prioritize speed
    infra-host-ttl: 900
    infra-cache-numhosts: 10000

    # DoT/DoH upstream (optional - uncomment to use)
    # forward-zone:
    #     name: "."
    #     forward-tls-upstream: yes
    #     forward-addr: 1.1.1.1@853#cloudflare-dns.com
    #     forward-addr: 1.0.0.1@853#cloudflare-dns.com

# Remote control for unbound-control
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953

# Forward zone to upstream DNS (use if not using DoT above)
forward-zone:
    name: "."
    forward-addr: 1.1.1.1        # Cloudflare DNS
    forward-addr: 1.0.0.1        # Cloudflare DNS
    forward-addr: 8.8.8.8        # Google DNS
    forward-addr: 8.8.4.4        # Google DNS

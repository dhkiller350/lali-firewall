# Squid Proxy Configuration for Raspberry Pi 3B+ with PS5 Optimization
# Place this file at: /etc/squid/squid.conf

# Network settings
http_port 3128

# Access Control Lists (ACLs)
acl localnet src 10.0.0.0/8     # RFC1918 possible internal network
acl localnet src 172.16.0.0/12  # RFC1918 possible internal network
acl localnet src 192.168.0.0/16 # RFC1918 possible internal network
acl localnet src fc00::/7       # RFC 4193 local private network range
acl localnet src fe80::/10      # RFC 4291 link-local (directly plugged) machines

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# PS5 specific domains and CDNs for caching
acl ps5_domains dstdomain .playstation.net .playstation.com .sony.com
acl ps5_downloads dstdomain .dl.playstation.net gs2.ww.prod.dl.playstation.net
acl game_updates dstdomain .akamaihd.net .llnwd.net .edgecast.net

# Deny requests to certain unsafe ports
http_access deny !Safe_ports

# Deny CONNECT to other than secure SSL ports
http_access deny CONNECT !SSL_ports

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny manager

# Allow local network
http_access allow localnet
http_access allow localhost

# Deny all other access to this proxy
http_access deny all

# Cache settings optimized for PS5 downloads and updates
# Adjust cache_dir size based on your SD card/storage capacity
# Default 5GB - increase if you have more storage available
# Format: cache_dir ufs /var/spool/squid <size_in_MB> 16 256
# Recommendations: 2-5GB for 32GB SD card, 10-20GB for 64GB+ SD card
cache_dir ufs /var/spool/squid 5000 16 256

# Maximum object size (large game updates/downloads)
maximum_object_size 4 GB
maximum_object_size_in_memory 512 KB

# Cache rules - keep PS5 downloads longer
refresh_pattern -i \.pkg$ 10080 90% 43200 override-expire override-lastmod reload-into-ims
refresh_pattern -i playstation\.net 1440 90% 10080
refresh_pattern -i \.bin$ 10080 90% 43200 override-expire override-lastmod reload-into-ims

# Default cache rules
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320

# Memory and performance settings for Raspberry Pi 3B+
cache_mem 256 MB
memory_replacement_policy heap GDSF

# CPU and workers (optimized for quad-core RPi 3B+)
workers 2

# Coredump directory
coredump_dir /var/spool/squid

# Logging
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log none

# DNS settings
dns_nameservers 127.0.0.1

# Performance tuning
pipeline_prefetch on
range_offset_limit -1

# Leave coredumps in the first cache dir
logfile_rotate 7

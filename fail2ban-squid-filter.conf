# Fail2ban filter for Squid proxy
# Place this file at: /etc/fail2ban/filter.d/squid.conf
#
# Blocks IPs that generate too many failed requests or abuse the proxy

[Definition]

# Failed auth attempts
failregex = ^.*TCP_DENIED/407.*<HOST>.*$
            ^.*TCP_DENIED/403.*<HOST>.*$
            ^.*TCP_DENIED/400.*<HOST>.*$

# Ignore localhost
ignoreregex = ^.*127\.0\.0\.1.*$
              ^.*::1.*$
